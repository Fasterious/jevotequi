# Vérifie chaque proposition : règles, données publiées, construction du site.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt
      - name: Tests des règles et des données publiées
        run: python3 -I -m unittest discover -s tests -v
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérification des types et construction
        working-directory: web
        run: npm ci && npm run typecheck && npm run build
      - name: Tests de la réception des avis (GitHub simulé)
        run: node --test tests/avis.test.cjs
