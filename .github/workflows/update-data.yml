# Met à jour les données chaque nuit à partir des archives de l'Assemblée nationale,
# puis pousse le résultat : l'hébergeur (Vercel, Netlify…) redéploie automatiquement.
name: Mise à jour des données

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: pip install -r pipeline/requirements.txt
      # Les amendements de 2022-2024 sont récupérés un par un : sans cache, une seule erreur réseau
      # ferait disparaître un amendement une nuit et réapparaître la suivante.
      - name: Documents déjà récupérés
        uses: actions/cache@v4
        with:
          path: data/raw/documents
          key: documents-${{ github.run_id }}
          restore-keys: documents-
      - name: Téléchargement, calcul et contrôles (un contrôle en échec arrête la publication)
        run: python3 -I pipeline/run.py all --refresh
      - name: Tests
        run: python3 -I -m unittest discover -s tests
      - name: Publier si les données ont changé
        run: |
          git config user.name "jevotequi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data data/reports
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Données : mise à jour du $(date -u +%Y-%m-%d)"
          git push
