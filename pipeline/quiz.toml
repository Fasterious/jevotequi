# Quiz « Et toi, tu aurais voté quoi ? »
#
# Chaque question renvoie à UN scrutin public de l'Assemblée nationale. Les positions des groupes
# ne sont jamais saisies ici : elles sont calculées à partir des votes nominatifs, comme partout
# sur le site. Ce fichier ne contient que la formulation, relue et discutable.
#
# Règles de rédaction (METHODOLOGIE.md § 14) :
#  1. Une question = un scrutin public, choisi parmi les votes disputés (au moins un groupe pour
#     et un groupe contre), de préférence décisifs (vote sur l'ensemble d'un texte, article clé).
#  2. La question décrit la mesure votée, en mots simples, en 160 caractères au plus, et se
#     termine par « ? ».
#  3. Aucun nom de parti, de groupe ou de député dans la question ni dans le contexte : l'origine
#     du texte est montrée après la réponse.
#  4. Pas de jugement de valeur ; pas de chiffre qui ne figure pas dans le texte voté.
#  5. « Pour » = voter pour la mesure décrite. Quand le scrutin porte sur un amendement de
#     suppression, la question décrit la mesure elle-même et porte `sens = "inverse"`.
#  6. Le contexte (300 caractères au plus) donne la date, le texte et ce qui change ; il ne dit
#     jamais le résultat ni le vote des groupes (révélés après la réponse).
#  7. `theme` ne sert qu'à corriger le thème automatique quand la question porte sur un autre
#     aspect du texte (justification dans `note`).
#  8. `statut` : « proposé » tant que la formulation n'a pas été relue par le comité éditorial,
#     « relu » ensuite, « retiré » pour ne plus la proposer.
#
# Ne jamais réordonner ni supprimer une question : les liens de résultats partagés reposent sur
# leur rang dans ce fichier. Ajouter les nouvelles à la fin ; retirer = statut « retiré ».
#
# Les contrôles Q1 à Q7 (pipeline/s6_quiz.py) vérifient ces règles à chaque exécution.

version = "1.0.0"

